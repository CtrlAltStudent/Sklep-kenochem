# Lokalna baza danych sklepu (PostgreSQL).
# Start:  docker compose up -d
# Stop:   docker compose down        (dane zostają w wolumenie sonax_pgdata)
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonax
      POSTGRES_PASSWORD: sonax_dev
      POSTGRES_DB: sonax_shop
    ports:
      - "5434:5432" # 5434, żeby nie kolidować z bazą sklepu Kenochem (5433)
    volumes:
      - sonax_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonax -d sonax_shop"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sonax_pgdata:
