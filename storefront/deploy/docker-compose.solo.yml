# Osobny serwer Sonax (własne porty 80/443). Sklep testowy zostaje przy docker-compose.yml.
services:
  postgres:
    image: postgres:17-alpine
    container_name: sonax-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonax
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w pliku .env}
      POSTGRES_DB: sonax_shop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonax -d sonax_shop"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - shop

  sonax:
    image: sonax-shop
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
        NEXT_PUBLIC_SKIP_KENOCHEM_IMAGES: "1"
        PAYLOAD_SECRET: ${PAYLOAD_SECRET}
    container_name: sonax-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      # Puste = nadal plik SQLite. Po przeniesieniu danych w .env jest postgres://…
      DATABASE_URL: ${DATABASE_URL:-file:/data/sonax.db}
      DATA_DIR: /data
      NODE_OPTIONS: --max-old-space-size=512
    volumes:
      - ./data:/data
      - ./media:/app/media
    expose:
      - "3000"
    networks:
      - shop

  # Osobny proces: mail, gdy strona albo BaseLinker przestają odpowiadać.
  watch:
    image: sonax-shop
    container_name: sonax-watch
    restart: unless-stopped
    entrypoint: ["node", "watch.mjs"]
    env_file: .env
    environment:
      WATCH_URL: https://sonax.sklep.pl/api/zdrowie
      DATA_DIR: /data
    volumes:
      - ./data:/data
    networks:
      - shop

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [sonax]
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - shop

volumes:
  caddy_data:
  caddy_config:
  pgdata:

networks:
  shop:
